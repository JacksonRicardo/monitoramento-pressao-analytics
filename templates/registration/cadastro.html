{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
<div class="row justify-content-center auth-wrapper align-items-center">
  <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
    <div class="text-center mb-4">
      <div class="auth-logo mx-auto mb-3"><i class="bi bi-person-plus-fill"></i></div>
      <h1 class="h3 fw-bold">Criar conta</h1>
    </div>
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "partials/form_campos.html" %}
          <button class="btn btn-brand w-100 py-2" type="submit">Cadastrar</button>
        </form>
      </div>
    </div>
    <p class="text-center mt-3">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
  </div>
</div>
{% endblock %}
