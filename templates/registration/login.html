{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center auth-wrapper">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
    <div class="text-center mb-4">
      <div class="auth-logo mx-auto mb-3"><i class="bi bi-heart-pulse-fill"></i></div>
      <h1 class="h3 fw-bold">Controle de Pressão</h1>
      <p class="text-body-secondary">Registre, acompanhe e compartilhe suas medições.</p>
    </div>
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        {% if form.errors %}
          <div class="alert alert-danger py-2">Usuário ou senha inválidos.</div>
        {% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="form-floating mb-3">
            <input type="text" name="username" class="form-control" id="id_username" placeholder="Usuário" autofocus required value="{{ form.username.value|default:'' }}">
            <label for="id_username">Usuário</label>
          </div>
          <div class="form-floating mb-3">
            <input type="password" name="password" class="form-control" id="id_password" placeholder="Senha" required>
            <label for="id_password">Senha</label>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button class="btn btn-brand w-100 py-2" type="submit"><i class="bi bi-box-arrow-in-right me-1"></i>Entrar</button>
        </form>
      </div>
    </div>
    <p class="text-center mt-3">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
  </div>
</div>
{% endblock %}
